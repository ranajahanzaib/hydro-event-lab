name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-hydro-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"

      - name: Ingest sample data & detect events
        run: |
          .venv/bin/python -m scripts.ingest_sample
          .venv/bin/python -m scripts.detect_events
          .venv/bin/python -m scripts.build_catalog

      - name: Run Ruff Linter
        run: .venv/bin/ruff check .

      - name: Run Python tests
        run: |
          .venv/bin/pytest tests/hydro tests/api -v

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Next.js application
        run: pnpm --filter web lint

      - name: Build Next.js application
        run: pnpm --filter web build
